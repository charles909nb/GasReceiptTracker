name: Verify worksheet and request workflow on Android
on:
  push:
    branches: [main, excel-embedded-finish, workflow-ui-v1-9, receipt-date-history-v2, receipt-visual-review-v2-1, finance-packet-archive-mileage-v2-2]
    paths: ['app/**', 'tools/run-excel-device-checks.sh', '.github/workflows/excel-verification.yml']
  pull_request:
    paths: ['app/**', 'tools/run-excel-device-checks.sh', '.github/workflows/excel-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: excel-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check bundled original worksheet and prepare approved icon
        shell: bash
        run: |
          set -euo pipefail
          echo '058c43238947d1feeff139a1b03e0aa4bfa78265e4f9aea1c1777c17ea0eefb5  app/src/main/assets/forms/Karuk_Gas_Original.xls' | sha256sum -c -
          mkdir -p app/src/main/res/drawable
          base64 -d app/icon-approved.b64 > app/src/main/res/drawable/approved_app_icon.png
          git archive --format=zip HEAD -o source-current.zip
      - name: Compile app and instrumented tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify original forms, OCR highlights, card checks and next-request workflow on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash tools/run-excel-device-checks.sh
      - name: Publish APK, actual outputs and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GasReceiptTracker-2.2-Finance-Archive-Mileage
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            verification/
            verification-instrumentation.txt
            EXCEL_STAGE_NOTES.md
            WORKFLOW_STAGE_NOTES.md
            source-current.zip
          if-no-files-found: warn
          retention-days: 30
