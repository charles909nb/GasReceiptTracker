name: Prepare source snapshot
on:
  push:
    branches: [workflow-ui-v1-9]
    paths: [.github/workflows/source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o current-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: current-source
          path: current-source.zip
          retention-days: 7
