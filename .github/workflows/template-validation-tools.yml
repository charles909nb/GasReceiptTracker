name: Prepare worksheet verification tools
on:
  push:
    branches: [excel-embedded-finish]
    paths: [.github/workflows/template-validation-tools.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect source and pinned verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-tools/jars verification-tools/python
          git archive --format=zip HEAD > verification-tools/source.zip
          base=https://repo.maven.apache.org/maven2
          for item in \
            org/apache/poi/poi/5.2.5/poi-5.2.5.jar \
            commons-codec/commons-codec/1.16.0/commons-codec-1.16.0.jar \
            org/apache/commons/commons-collections4/4.4/commons-collections4-4.4.jar \
            org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar \
            commons-io/commons-io/2.15.0/commons-io-2.15.0.jar \
            com/zaxxer/SparseBitSet/1.3/SparseBitSet-1.3.jar \
            org/apache/logging/log4j/log4j-api/2.21.1/log4j-api-2.21.1.jar \
            org/json/json/20240303/json-20240303.jar; do
            curl --fail --location --retry 3 "$base/$item" -o "verification-tools/jars/$(basename "$item")"
          done
          python -m pip download --no-deps --dest verification-tools/python xlrd==2.0.1
          sha256sum verification-tools/jars/*.jar > verification-tools/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: worksheet-verification-tools
          path: verification-tools/
          retention-days: 7
          if-no-files-found: error
