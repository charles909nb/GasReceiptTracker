name: Build Gas Receipt Tracker APK
on:
  push:
    branches: [main, phase-2-5-documents]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare approved app icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d app/icon-approved.b64 > app/src/main/res/drawable/approved_app_icon.png
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GasReceiptTracker-V1.1-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
