name: Build Gas Receipt Tracker APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack Android project
        run: |
          set -euo pipefail
          unzip -q GasReceiptTracker_V1_Source.zip -d extracted
          test -f extracted/GasReceiptTrackerV1/settings.gradle.kts
      - name: Build debug APK
        working-directory: extracted/GasReceiptTrackerV1
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: GasReceiptTracker-V1-Test-APK
          path: extracted/GasReceiptTrackerV1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
